# Example training config: Swin-Tiny (timm, ImageNet pretrained)
# Usage: garbage train --config configs/swin_tiny.yaml
model:
  name: swin_tiny_patch4_window7_224
  source: timm
  pretrained: true
train:
  epochs: 60
  batch_size: 32
  lr: 0.0005
  optimizer: adamw
  scheduler: cosine
  label_smoothing: 0.1
  amp: true
  early_stop_patience: 12
  best_metric: macro_f1
data:
  image_size: 224
  aug: randaug
  num_workers: 4
device: auto
