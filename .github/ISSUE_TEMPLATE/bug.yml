name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private data and attach the smallest reproducible example.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide exact commands, config overrides, and relevant paths.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python, PyTorch, device, and package version or commit.
    validations:
      required: true
  - type: input
    id: data_version
    attributes:
      label: Data version
      description: Source checksum, audit patch, and manifest checksum if data is involved.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and removed secrets/private data.
          required: true
