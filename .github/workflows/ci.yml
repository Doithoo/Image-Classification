name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked --all-extras --dev

      - name: Ruff
        run: |
          uv run ruff check src/ tests/
          uv run ruff format --check src/ tests/

      - name: Pre-commit
        run: uv run pre-commit run --all-files

      - name: Test
        run: uv run pytest tests/ -q

      - name: CLI smoke (help + version)
        run: |
          uv run garbage --version
          uv run garbage prepare-data --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - name: Build and validate distributions
        run: |
          uv build
          uv run twine check dist/*
      - name: Clean wheel console smoke
        run: |
          uv venv --python 3.12 /tmp/garbage-wheel-smoke
          uv pip install --python /tmp/garbage-wheel-smoke/bin/python dist/*.whl
          /tmp/garbage-wheel-smoke/bin/garbage --version
