[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garbage-classifier"
version = "1.3.0"
description = "Garbage image classification: reproducible training, evaluation and inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yashowhoo" }]
keywords = ["image-classification", "pytorch", "garbage-classification", "deep-learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=1.0",
    "numpy>=1.24",
    "pillow>=9.0",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "matplotlib>=3.6",
    "lion-pytorch>=0.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "ptflops>=0.7",
    "torchinfo>=1.8",
]
onnx = ["onnx>=1.14", "onnxruntime>=1.16"]
demo = ["gradio>=4.0"]

[project.scripts]
garbage = "garbage_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garbage_classifier = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/garbage_classifier/models/legacy_models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
