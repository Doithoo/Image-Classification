[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "garbage-classifier"
version = "1.8.0"
description = "Garbage image classification: reproducible training, evaluation and inference"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yashowhoo" }]
keywords = ["image-classification", "pytorch", "garbage-classification", "deep-learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0,<3",
    "torchvision>=0.15,<1",
    "timm>=1.0,<2",
    "numpy>=1.24,<3",
    "pillow>=9.0,<12",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "ruff>=0.6,<1",
    "pre-commit>=3.0,<5",
    "build>=1.2,<2",
    "twine>=5,<7",
    "tomli>=2,<3; python_version < '3.11'",
    "ptflops>=0.7,<1",
    "matplotlib>=3.6,<4",
    "lion-pytorch>=0.0.8,<1",
]
onnx = ["onnx>=1.14,<2", "onnxruntime>=1.16,<2"]
demo = ["gradio>=4.0,<7"]
plot = ["matplotlib>=3.6,<4"]
lion = ["lion-pytorch>=0.0.8,<1"]
all = [
    "onnx>=1.14,<2",
    "onnxruntime>=1.16,<2",
    "gradio>=4.0,<7",
    "matplotlib>=3.6,<4",
    "lion-pytorch>=0.0.8,<1",
]

[project.scripts]
garbage = "garbage_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garbage_classifier = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
