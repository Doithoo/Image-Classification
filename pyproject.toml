[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "garbage-classifier"
version = "1.9.0"
description = "Reproducible PyTorch image classification with auditable data and evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yashowhoo" }]
keywords = ["image-classification", "pytorch", "computer-vision", "reproducibility", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0,<3",
    "torchvision>=0.15,<1",
    "timm>=1.0,<2",
    "numpy>=1.24,<3",
    "pillow>=9.0,<12",
    "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/Doithoo/pytorch-image-classification-lab"
Repository = "https://github.com/Doithoo/pytorch-image-classification-lab"
Documentation = "https://github.com/Doithoo/pytorch-image-classification-lab#readme"
Issues = "https://github.com/Doithoo/pytorch-image-classification-lab/issues"
Security = "https://github.com/Doithoo/pytorch-image-classification-lab/security/advisories/new"

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<9",
    "ruff>=0.6,<1",
    "mypy>=1.15,<3",
    "types-PyYAML>=6,<7",
    "pre-commit>=3.0,<5",
    "build>=1.2,<2",
    "twine>=5,<7",
    "tomli>=2,<3; python_version < '3.11'",
    "ptflops>=0.7,<1",
    "matplotlib>=3.6,<4",
    "lion-pytorch>=0.0.8,<1",
]
onnx = [
    "onnx>=1.14,<2",
    "onnxruntime>=1.16,<1.24; python_version < '3.11'",
    "onnxruntime>=1.16,<2; python_version >= '3.11'",
]
demo = ["gradio>=4.0,<7"]
plot = ["matplotlib>=3.6,<4"]
lion = ["lion-pytorch>=0.0.8,<1"]
all = [
    "onnx>=1.14,<2",
    "onnxruntime>=1.16,<1.24; python_version < '3.11'",
    "onnxruntime>=1.16,<2; python_version >= '3.11'",
    "gradio>=4.0,<7",
    "matplotlib>=3.6,<4",
    "lion-pytorch>=0.0.8,<1",
]

[project.scripts]
garbage = "garbage_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garbage_classifier = ["py.typed"]

[tool.setuptools.data-files]
"share/garbage-classifier/configs" = [
    "configs/imbalance_none.yaml",
    "configs/imbalance_weighted_loss.yaml",
    "configs/imbalance_weighted_sampler.yaml",
    "configs/learning_minimal.yaml",
    "configs/reference_resnet50.yaml",
    "configs/resnet50.yaml",
    "configs/swin_tiny.yaml",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts", "examples"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts", "examples"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
